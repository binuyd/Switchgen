<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Secure MQTT Switch Controller</title>
    <!-- MQTT.js library -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="floating-particles"></div>

    <div class="main-container">
        <!-- Header Section -->
        <header class="header-wrapper">
            <div class="brand-title-group">
                <div class="brand-logo">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1 class="page-title">Secure Switch System</h1>
            </div>
            
            <div class="header-actions">
                <div id="connection-status" class="connection-status disconnected">
                    <div class="status-dot"></div>
                    <span>Connecting...</span>
                </div>
                <button class="btn-settings" id="open-settings-btn" title="Broker & Security Settings">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </header>

        <!-- Warning Notice Banner -->
        <div class="system-warning-banner">
            <i class="fas fa-triangle-exclamation"></i>
            <span><strong>Notice:</strong> Commands are sent via obfuscated MQTT channels. This system does not receive real-time status feedback from physical hardware.</span>
        </div>

        <!-- Devices Grid -->
        <main id="devices" class="device-grid">
            <!-- Device cards generated dynamically by JS -->
        </main>
    </div>

    <!-- Security & Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fas fa-user-lock"></i> MQTT Security Configuration</h3>
                <button class="modal-close" id="close-settings-btn">&times;</button>
            </div>
            <form id="settings-form">
                <div class="form-group">
                    <label class="form-label">MQTT WebSocket Broker URL</label>
                    <input type="text" id="cfg-broker" class="form-control-custom" placeholder="wss://broker.hivemq.com:8884/mqtt" required>
                    <div class="form-hint">Use a private WSS endpoint for production.</div>
                </div>
                <div class="form-group">
                    <label class="form-label">MQTT Username (Optional)</label>
                    <input type="text" id="cfg-username" class="form-control-custom" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label class="form-label">MQTT Password / Auth Token (Optional)</label>
                    <input type="password" id="cfg-password" class="form-control-custom" placeholder="Enter password or token">
                </div>
                <div class="form-group">
                    <label class="form-label">Device Secret Key / Obfuscated Topic Namespace</label>
                    <input type="text" id="cfg-namespace" class="form-control-custom" placeholder="e.g. secret-namespace-998">
                    <div class="form-hint">Topic format: <code>home/v1/{SecretKey}/control/{device}</code></div>
                </div>
                <button type="submit" class="btn-modern btn-timer" style="width: 100%; margin-top: 1rem;">
                    <i class="fas fa-save"></i> Save & Reconnect
                </button>
            </form>
        </div>
    </div>

    <script>
        // Default Security & Broker Configurations with LocalStorage Persistence
        const DEFAULT_CONFIG = {
            broker: 'wss://broker.hivemq.com:8884/mqtt',
            username: '',
            password: '',
            namespace: 'sec-' + Math.random().toString(36).substring(2, 10)
        };

        function getStoredConfig() {
            try {
                const stored = localStorage.getItem('mqtt_sec_config');
                if (stored) {
                    return { ...DEFAULT_CONFIG, ...JSON.parse(stored) };
                }
            } catch (e) {
                console.warn('LocalStorage error:', e);
            }
            return DEFAULT_CONFIG;
        }

        function saveConfig(cfg) {
            try {
                localStorage.setItem('mqtt_sec_config', JSON.stringify(cfg));
            } catch (e) {
                console.error('Failed to save configuration:', e);
            }
        }

        let currentConfig = getStoredConfig();
        let client = null;
        const activeTimers = {};
        const deviceStates = {};

        const connectionStatus = document.getElementById('connection-status');

        function initMQTTClient() {
            if (client) {
                try { client.end(true); } catch (e) {}
            }

            const connectOptions = {
                connectTimeout: 5000,
                clientId: 'webClient-' + Math.random().toString(36).substring(2, 10),
                keepalive: 60,
                clean: true
            };

            if (currentConfig.username && currentConfig.username.trim() !== '') {
                connectOptions.username = currentConfig.username.trim();
            }
            if (currentConfig.password && currentConfig.password.trim() !== '') {
                connectOptions.password = currentConfig.password.trim();
            }

            console.log(`Connecting to broker: ${currentConfig.broker} with namespace: ${currentConfig.namespace}`);
            
            if (connectionStatus) {
                connectionStatus.className = 'connection-status disconnected';
                connectionStatus.innerHTML = '<div class="status-dot"></div><span>Connecting...</span>';
            }

            try {
                client = mqtt.connect(currentConfig.broker, connectOptions);

                client.on('connect', () => {
                    console.log('✅ Connected to MQTT broker securely');
                    if (connectionStatus) {
                        connectionStatus.className = 'connection-status connected';
                        connectionStatus.innerHTML = '<div class="status-dot"></div><span>Connected</span>';
                    }
                });

                client.on('disconnect', () => {
                    if (connectionStatus) {
                        connectionStatus.className = 'connection-status disconnected';
                        connectionStatus.innerHTML = '<div class="status-dot"></div><span>Disconnected</span>';
                    }
                });

                client.on('error', (error) => {
                    console.error('MQTT Error:', error);
                    showNotification('Connection error occurred', 'error');
                });
            } catch (err) {
                console.error('MQTT Initialization Failure:', err);
                showNotification('Invalid Broker URL configuration', 'error');
            }
        }

        const devices = [
            { id: "bulb", name: "Smart Bulb", icon: "fas fa-lightbulb", timer: true },
            { id: "plug", name: "Smart Plug", icon: "fas fa-plug", timer: true },
            { id: "fan", name: "Ceiling Fan", icon: "fas fa-fan", timer: true }
        ];

        function showNotification(message, type = 'info') {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : type === 'error' ? 'exclamation-circle' : 'info-circle'}"></i><span>${message}</span>`;
            document.body.appendChild(notification);

            setTimeout(() => notification.classList.add('show'), 50);
            setTimeout(() => {
                notification.classList.remove('show');
                setTimeout(() => {
                    if (notification.parentNode) {
                        notification.parentNode.removeChild(notification);
                    }
                }, 300);
            }, 3000);
        }

        function updateDeviceState(device, isActive) {
            deviceStates[device] = isActive;
            const card = document.getElementById(`card-${device}`);
            const badge = document.getElementById(`badge-${device}`);
            
            if (card) {
                if (isActive) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            }
            if (badge) {
                badge.textContent = isActive ? 'ACTIVE' : 'OFF';
            }
        }

        function sendCommand(device, state) {
            if (!client || !client.connected) {
                showNotification('Not connected to MQTT broker', 'error');
                return;
            }

            // Obfuscated & Namespaced Topic Structure
            const sanitizedNamespace = currentConfig.namespace.trim().replace(/[^a-zA-Z0-9_-]/g, '');
            const topic = `home/v1/${sanitizedNamespace}/control/${device}`;
            
            // Validate payload state
            const payload = (state === 'ON') ? 'ON' : 'OFF';
            
            client.publish(topic, payload, { qos: 1 });
            console.log(`📤 Sent "${payload}" to Obfuscated Topic: ${topic}`);
            
            updateDeviceState(device, payload === 'ON');
            showNotification(`${device.toUpperCase()} turned ${payload}`, payload === 'ON' ? 'success' : 'info');
        }

        /**
         * Strict Input Sanitization & Validation for Timer Controls
         */
        function validateTimerInput(value, max) {
            if (value === null || value === undefined || value.trim() === '') return 0;
            
            // Reject non-numeric characters, floats, or scientific notation
            if (!/^\d+$/.test(value.trim())) {
                return null;
            }
            
            const num = Number(value.trim());
            if (!Number.isInteger(num) || num < 0 || num > max) {
                return null;
            }
            return num;
        }

        function sendTimer(device) {
            const hourInput = document.getElementById(`timer-hour-${device}`);
            const minInput = document.getElementById(`timer-min-${device}`);
            
            const hoursVal = hourInput ? hourInput.value : '';
            const minsVal = minInput ? minInput.value : '';

            // Strict Server-grade Input Validation
            const hours = validateTimerInput(hoursVal, 23);
            const minutes = validateTimerInput(minsVal, 59);

            if (hours === null) {
                if (hourInput) hourInput.classList.add('invalid');
                showNotification("Invalid Hours! Must be a whole number between 0 and 23.", 'error');
                return;
            } else if (hourInput) {
                hourInput.classList.remove('invalid');
            }

            if (minutes === null) {
                if (minInput) minInput.classList.add('invalid');
                showNotification("Invalid Minutes! Must be a whole number between 0 and 59.", 'error');
                return;
            } else if (minInput) {
                minInput.classList.remove('invalid');
            }

            const totalSeconds = (hours * 3600) + (minutes * 60);

            if (totalSeconds <= 0) {
                showNotification("Please specify a duration greater than 0 minutes.", 'error');
                return;
            }

            if (totalSeconds > 86400) { // Max 24 Hours
                showNotification("Timer duration cannot exceed 24 hours.", 'error');
                return;
            }

            // Clear existing timer if running
            if (activeTimers[device]) {
                clearInterval(activeTimers[device]);
                delete activeTimers[device];
            }

            sendCommand(device, "ON");

            const countdownEl = document.getElementById(`countdown-${device}`);
            if (countdownEl) {
                countdownEl.classList.add('active');
            }
            let remaining = totalSeconds;

            activeTimers[device] = setInterval(() => {
                const hrs = Math.floor(remaining / 3600);
                const mins = Math.floor((remaining % 3600) / 60);
                const secs = remaining % 60;
                
                if (countdownEl) {
                    countdownEl.innerHTML = `<i class="fas fa-clock"></i><span>Time left: ${hrs.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}</span>`;
                }
                
                if (--remaining < 0) {
                    clearInterval(activeTimers[device]);
                    delete activeTimers[device];
                    
                    if (countdownEl) {
                        countdownEl.innerHTML = '<i class="fas fa-check"></i><span>Timer completed!</span>';
                    }
                    sendCommand(device, "OFF");
                    
                    setTimeout(() => {
                        if (countdownEl) {
                            countdownEl.classList.remove('active');
                        }
                    }, 3000);
                }
            }, 1000);

            // Clear input fields
            if (hourInput) hourInput.value = '';
            if (minInput) minInput.value = '';
        }

        // Generate ambient background floating particles
        function createParticles() {
            const container = document.querySelector('.floating-particles');
            if (!container) return;
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = (Math.random() * 15) + 's';
                particle.style.animationDuration = (Math.random() * 10 + 15) + 's';
                container.appendChild(particle);
            }
        }

        // Render Device Cards
        const devicesContainer = document.getElementById("devices");
        if (devicesContainer) {
            devicesContainer.innerHTML = devices.map(device => `
                <div class="device-card" id="card-${device.id}">
                    <div class="card-body">
                        <span class="device-badge-status" id="badge-${device.id}">OFF</span>
                        <div class="device-icon-wrapper">
                            <i class="${device.icon} device-icon"></i>
                        </div>
                        <h2 class="card-title">${device.name}</h2>
                        
                        <div class="control-buttons">
                            <button class="btn-modern btn-on" onclick="sendCommand('${device.id}', 'ON')">
                                <i class="fas fa-power-off"></i>ON
                            </button>
                            <button class="btn-modern btn-off" onclick="sendCommand('${device.id}', 'OFF')">
                                <i class="fas fa-times"></i>OFF
                            </button>
                        </div>
                        
                        ${device.timer ? `
                            <div class="timer-container">
                                <div class="timer-inputs">
                                    <input type="number" id="timer-hour-${device.id}" class="timer-input" placeholder="Hours" min="0" max="23">
                                    <input type="number" id="timer-min-${device.id}" class="timer-input" placeholder="Mins" min="0" max="59">
                                </div>
                                <button class="btn-modern btn-timer" onclick="sendTimer('${device.id}')">
                                    <i class="fas fa-clock"></i>Set Timer
                                </button>
                                <div id="countdown-${device.id}" class="countdown-display"></div>
                            </div>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // Settings Modal Management
        const modal = document.getElementById('settings-modal');
        const openBtn = document.getElementById('open-settings-btn');
        const closeBtn = document.getElementById('close-settings-btn');
        const settingsForm = document.getElementById('settings-form');

        if (openBtn && modal) {
            openBtn.addEventListener('click', () => {
                document.getElementById('cfg-broker').value = currentConfig.broker;
                document.getElementById('cfg-username').value = currentConfig.username;
                document.getElementById('cfg-password').value = currentConfig.password;
                document.getElementById('cfg-namespace').value = currentConfig.namespace;
                modal.classList.add('show');
            });
        }

        if (closeBtn && modal) {
            closeBtn.addEventListener('click', () => {
                modal.classList.remove('show');
            });
        }

        if (settingsForm) {
            settingsForm.addEventListener('submit', (e) => {
                e.preventDefault();
                currentConfig.broker = document.getElementById('cfg-broker').value.trim();
                currentConfig.username = document.getElementById('cfg-username').value.trim();
                currentConfig.password = document.getElementById('cfg-password').value.trim();
                currentConfig.namespace = document.getElementById('cfg-namespace').value.trim() || 'default-namespace';
                
                saveConfig(currentConfig);
                if (modal) modal.classList.remove('show');
                showNotification('Configuration saved! Reconnecting...', 'success');
                initMQTTClient();
            });
        }

        // Initialize App & Connection
        createParticles();
        initMQTTClient();

        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.btn-modern');
            buttons.forEach(button => {
                button.addEventListener('mouseenter', () => {
                    if (navigator.vibrate) {
                        navigator.vibrate(10);
                    }
                });
            });
        });
    </script>
</body>
</html>
